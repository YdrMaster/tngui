[package]
name = "tngui-agent"
version.workspace = true
edition.workspace = true
description = "TNG-GUI Agent 模式：基于 rpi 的单次多轮工具调用运行器"

[dependencies]
rpi-ai = { version = "0.11.0", features = ["providers"] }
rpi-agent = "0.11.0"
rpi-tools = "0.11.0"
rpi-harness = "0.11.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
