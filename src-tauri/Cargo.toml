# 注意：src-tauri 是独立 crate（自带 [workspace]），不纳入根 workspace，
# 因为 headless 无 WebKitGTK 的构建机无法编译 Tauri。请在带 WebKitGTK 的机器上
# 运行 `cargo tauri dev` / `cargo tauri build`（或 `cd src-tauri && cargo build`）。
[package]
name = "tngui-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "TNG GUI 包装器——Tauri 2 外壳"

[lib]
name = "tngui_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tngui-core = { path = "../crates/tngui-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.dev]
incremental = true

# 标记本 crate 为独立 workspace 根，避免被根 Cargo.toml 的 workspace 拉入。
[workspace]