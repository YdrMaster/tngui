[package]
name = "tngui-chat"
version.workspace = true
edition.workspace = true
description = "TNG-GUI 对话模式：手写 OpenAI 兼容 SSE 客户端与两种模式共享的消息模型"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-util",
    "net",
] }
