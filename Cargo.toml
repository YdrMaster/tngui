[workspace]
resolver = "2"

[workspace.package]
version = "0.4.6"
edition = "2024"

[package]
name = "tngui-app"
version.workspace = true
edition.workspace = true
description = "TNG-GUI"

[lib]
name = "tngui_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tngui-core = { path = "tngui-core" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
