[package]
name = "tngui-core"
version.workspace = true
edition.workspace = true
description = "TNG-GUI-core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-util",
    "process",
    "net",
    "sync",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
